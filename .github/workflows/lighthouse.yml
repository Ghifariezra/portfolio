name: Lighthouse CI

on:
    pull_request:
        branches: ["main"]
    # Setelah deploy ke GitHub Pages selesai, test situs live (https://ezdev.xyz).
    workflow_run:
        workflows: ["Deploy to GitHub Pages"]
        types: [completed]
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lhci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lighthouse:
        name: lighthouse (${{ github.event_name == 'workflow_run' && 'live site' || 'local build' }})
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build (PR / manual)
              if: github.event_name != 'workflow_run'
              run: pnpm build
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}

            - name: Tunggu CDN GitHub Pages
              if: github.event_name == 'workflow_run'
              run: sleep 60

            - name: Run Lighthouse CI
              run: pnpm exec lhci autorun
              env:
                  LHCI_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://ezdev.xyz' || '' }}
