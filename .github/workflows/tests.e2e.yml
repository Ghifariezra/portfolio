name: E2E Tests

on:
    pull_request:
        branches: ["main"]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: build (dist untuk e2e)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            playwright-version: ${{ steps.pw.outputs.version }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Install Chromium (untuk snapshot-routes)
              run: pnpm exec playwright install --with-deps chromium
            - name: Playwright version
              id: pw
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            - name: Build
              run: pnpm build
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}
                  REQUIRE_SNAPSHOT: "1"
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    e2e:
        name: e2e (${{ matrix.project }})
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        container:
            image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
            options: --user 1001
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(github.event_name == 'pull_request'
                    && '["chromium"]'
                    || '["chromium","firefox","webkit","mobile-chrome","mobile-safari"]') }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Run E2E tests (${{ matrix.project }})
              run: pnpm exec playwright test --project=${{ matrix.project }}
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.project }}
                  path: playwright-report/
                  retention-days: 14

            - name: Upload test results (traces)
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-${{ matrix.project }}
                  path: test-results/
                  retention-days: 7
