name: E2E Tests

on:
    pull_request:
        branches: ["main"]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: build (dist untuk e2e)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm build
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    e2e:
        name: e2e (${{ matrix.project }})
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(github.event_name == 'pull_request'
                    && '[{"project":"chromium","browser":"chromium"}]'
                    || '[{"project":"chromium","browser":"chromium"},{"project":"firefox","browser":"firefox"},{"project":"webkit","browser":"webkit"},{"project":"mobile-chrome","browser":"chromium"},{"project":"mobile-safari","browser":"webkit"}]') }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Playwright version
              id: pw
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache browser binaries
              id: pw-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

            - name: Install browser + system deps
              if: steps.pw-cache.outputs.cache-hit != 'true'
              timeout-minutes: 5
              run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

            - name: Install system deps only
              if: steps.pw-cache.outputs.cache-hit == 'true'
              timeout-minutes: 5
              run: pnpm exec playwright install-deps ${{ matrix.browser }}

            - name: Run E2E tests (${{ matrix.project }})
              run: pnpm exec playwright test --project=${{ matrix.project }}
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.project }}
                  path: playwright-report/
                  retention-days: 14

            - name: Upload test results (traces)
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-${{ matrix.project }}
                  path: test-results/
                  retention-days: 7
