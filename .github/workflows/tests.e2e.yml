name: E2E Tests

on:
    pull_request:
        branches: ["main"]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: build (dist untuk e2e)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm build
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    e2e:
        name: e2e (${{ matrix.project }})
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(github.event_name == 'pull_request'
                    && '[{"project":"chromium","browser":"chromium"}]'
                    || '[{"project":"chromium","browser":"chromium"},{"project":"firefox","browser":"firefox"},{"project":"webkit","browser":"webkit"},{"project":"mobile-chrome","browser":"chromium"},{"project":"mobile-safari","browser":"webkit"}]') }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Playwright version
              id: pw
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache browser binaries
              id: pw-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

            - name: Make apt fail fast on stalled mirrors
              run: |
                  echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

            - name: Install Playwright system deps (+ browser on cache miss)
              timeout-minutes: 12
              env:
                  CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
              run: |
                  if [ "$CACHE_HIT" = "true" ]; then CMD="install-deps"; else CMD="install --with-deps"; fi
                  for i in 1 2 3; do
                      timeout --kill-after=10 180 pnpm exec playwright $CMD ${{ matrix.browser }} && exit 0
                      echo "attempt $i failed or timed out, cleaning up apt and retrying..."
                      sudo pkill -KILL -x apt-get || true
                      sudo pkill -KILL -x apt || true
                      sudo pkill -KILL -x dpkg || true
                      sudo dpkg --configure -a || true
                  done
                  exit 1

            - name: Run E2E tests (${{ matrix.project }})
              run: pnpm exec playwright test --project=${{ matrix.project }}
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL }}

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.project }}
                  path: playwright-report/
                  retention-days: 14

            - name: Upload test results (traces)
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-${{ matrix.project }}
                  path: test-results/
                  retention-days: 7
